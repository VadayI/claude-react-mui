name: React exact runner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      base:
        description: Exact ancestor commit for manual verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Exact candidate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned browser CLI
        run: npm ci
      - name: Install browser prerequisite
        run: npx playwright install --with-deps chromium
      - name: Run exact-candidate catalog
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_CANDIDATE: ${{ github.sha }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BASE: ${{ github.event.before }}
          CI_MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          CI_MANUAL_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          case "$CI_EVENT" in
            pull_request) event=pull_request; base="$CI_PR_BASE" ;;
            push) event=push; base="$CI_PUSH_BASE" ;;
            merge_group) event=pull_request; base="$CI_MERGE_BASE" ;;
            workflow_dispatch) event=manual; base="$CI_MANUAL_BASE" ;;
            *) echo "Unsupported CI event: $CI_EVENT" >&2; exit 2 ;;
          esac
          python scripts/ai/runner.py --repository . --candidate "$CI_CANDIDATE" --base "$base" --event "$event" --network allowed --catalog templates/ai/checks/react.json --output .ai-runtime/results/react.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-exact-runner-result
          path: .ai-runtime/results/react.json
          if-no-files-found: warn
