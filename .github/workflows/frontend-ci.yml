name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate — npm audit (high/critical)
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Gate — file size
        run: bash scripts/check_file_size.sh

      - name: Gate — stubs
        run: bash scripts/check_stubs.sh

      - name: Gate — feature READMEs
        run: bash scripts/check_feature_readmes.sh

      - name: Gate — API types drift
        run: bash scripts/check_types_drift.sh

      - name: Test with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Gate — bundle size
        run: bash scripts/check_bundle_size.sh

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
